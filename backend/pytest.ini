[pytest]
# Run from the backend/ directory:  .venv/Scripts/python.exe -m pytest tests -v
#
# Puts backend/ on sys.path so tests can `import app` without installing the
# package. Relative to this file's directory (the rootdir).
pythonpath = .

testpaths = tests

# PyMuPDF 1.28 warns that `import fitz` is deprecated in favour of `import
# pymupdf`. The services import `fitz` throughout; suppressing the notice here
# keeps real failures visible in the test output.
filterwarnings =
    ignore:The .fitz. API is deprecated

markers =
    slow: tests requiring model download or heavy deep learning inference

